services:
  # ── Backend (Go/Gin) ──────────────────────────────────────────────────────
  urna-backend:
    image: ghcr.io/jamersoncarlos/urna-backend:latest
    container_name: urna-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: "8080"
      FRONTEND_URL: "https://ejc-urna.agreser.tech"
      JWT_SECRET: "${JWT_SECRET}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      CLOUDINARY_URL: "${CLOUDINARY_URL:-}"
      CLOUDINARY_FOLDER: "${CLOUDINARY_FOLDER:-urna/candidatos}"
    depends_on:
      - urna-seed
    networks:
      - agresernet
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=agresernet"
      # HTTPS Router (REST + WebSocket)
      - "traefik.http.routers.urna-backend.rule=Host(`api-ejc-urna.agreser.tech`)"
      - "traefik.http.routers.urna-backend.entrypoints=websecure"
      - "traefik.http.routers.urna-backend.tls=true"
      - "traefik.http.routers.urna-backend.tls.certresolver=letsencryptresolver"

      # HTTP Redirect
      - "traefik.http.routers.urna-backend-http.rule=Host(`api-ejc-urna.agreser.tech`)"
      - "traefik.http.routers.urna-backend-http.entrypoints=web"
      - "traefik.http.routers.urna-backend-http.middlewares=urna-https-redirect"

      # Service definition
      - "traefik.http.services.urna-backend-svc.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.urna-https-redirect.redirectscheme.scheme=https"

  # ── Seed (migrations + usuário mesário) ───────────────────────────────────
  urna-seed:
    image: ghcr.io/jamersoncarlos/urna-backend:latest
    container_name: urna-seed
    entrypoint: ["/seed"]
    # roda uma vez; só repete se falhar (no Swarm o padrão seria reiniciar sempre)
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
    environment:
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      ADMIN_NAME: "${ADMIN_NAME:-Mesário}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      SEED_DEMO: "${SEED_DEMO:-false}"
    networks:
      - agresernet

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────
  urna-frontend:
    image: ghcr.io/jamersoncarlos/urna-frontend:latest
    container_name: urna-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: "${VITE_API_URL:-https://api-ejc-urna.agreser.tech}"
    depends_on:
      - urna-backend
    networks:
      - agresernet
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=agresernet"
      # Router HTTPS
      - "traefik.http.routers.urna-frontend-secure.rule=Host(`ejc-urna.agreser.tech`)"
      - "traefik.http.routers.urna-frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.urna-frontend-secure.tls=true"
      - "traefik.http.routers.urna-frontend-secure.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.urna-frontend-secure.service=urna-frontend-svc"
      # Router HTTP Redirect
      - "traefik.http.routers.urna-frontend-http.rule=Host(`ejc-urna.agreser.tech`)"
      - "traefik.http.routers.urna-frontend-http.entrypoints=web"
      - "traefik.http.routers.urna-frontend-http.middlewares=urna-https-redirect"

      # Service
      - "traefik.http.services.urna-frontend-svc.loadbalancer.server.port=80"

networks:
  agresernet:
    external: true
